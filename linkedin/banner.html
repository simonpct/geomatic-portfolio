<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>LinkedIn banner — Simon Picot</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Dimensions LinkedIn banner */
      :root {
        --w: 1584px;
        --h: 396px;

        /* Palette portfolio */
        --surface: #fafaf9;
        --surface-elevated: #ffffff;
        --text: #1c1c1c;
        --text-muted: #57534e;
        --text-subtle: #78716c;
        --accent: #1f4d3a;
        --border: #e7e5e4;
      }

      * {
        box-sizing: border-box;
      }
      html {
        margin: 0;
        padding: 0;
        background: var(--surface);
      }
      body {
        margin: 0;
        padding: 0;
        width: 1584px;
        height: 396px;
        background: var(--surface);
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
      }

      .banner {
        position: relative;
        width: var(--w);
        height: var(--h);
        background: var(--surface);
        color: var(--text);
        overflow: hidden;
      }

      /* Grille technique en fond */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(0, 0, 0, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(0, 0, 0, 0.05) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      /* Halo accent discret à droite */
      .glow {
        position: absolute;
        right: -200px;
        top: -150px;
        width: 700px;
        height: 700px;
        background: radial-gradient(
          circle,
          rgba(31, 77, 58, 0.08) 0%,
          rgba(31, 77, 58, 0) 70%
        );
        pointer-events: none;
      }

      /* Contenu centré horizontalement et verticalement.
         Note : la photo de profil LinkedIn se superpose en bas à gauche
         (~280px de bord gauche, ~200px du bas). Avec un texte centré et
         vertical centré, ça reste lisible. */
      .content {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        gap: 14px;
      }

      .label {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 600;
        font-size: 16px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: var(--accent);
      }

      .title {
        font-family: "Space Grotesk", system-ui, sans-serif;
        font-weight: 700;
        font-size: 88px;
        line-height: 1;
        letter-spacing: -1.5px;
        color: var(--text);
        margin: 0;
        white-space: nowrap;
      }

      .title .plus {
        color: var(--accent);
        margin: 0 12px;
      }

      .subtitle {
        font-family: "Inter", system-ui, sans-serif;
        font-weight: 500;
        font-size: 24px;
        color: var(--text-muted);
        margin: 0;
      }

      .subtitle .kw {
        color: var(--accent);
        font-weight: 600;
      }

      /* Brackets décoratifs aux 4 coins, style atelier */
      .bracket {
        position: absolute;
        width: 28px;
        height: 28px;
        border-color: var(--text-subtle);
        border-style: solid;
        border-width: 0;
      }
      .bracket.tl {
        top: 32px;
        left: 32px;
        border-top-width: 1.5px;
        border-left-width: 1.5px;
      }
      .bracket.tr {
        top: 32px;
        right: 32px;
        border-top-width: 1.5px;
        border-right-width: 1.5px;
      }
      .bracket.bl {
        bottom: 32px;
        left: 32px;
        border-bottom-width: 1.5px;
        border-left-width: 1.5px;
      }
      .bracket.br {
        bottom: 32px;
        right: 32px;
        border-bottom-width: 1.5px;
        border-right-width: 1.5px;
      }
    </style>
  </head>
  <body>
    <div class="banner">
      <div class="grid"></div>
      <div class="glow"></div>

      <div class="bracket tl"></div>
      <div class="bracket tr"></div>
      <div class="bracket bl"></div>
      <div class="bracket br"></div>

      <div class="content">
        <p class="label">
          Recherche alternance · Licence Pro SIG · Sept. 2026
        </p>
        <h1 class="title">Géomatique<span class="plus">+</span>dev web</h1>
        <p class="subtitle">
          Acquisition <span class="kw">LiDAR</span>, analyse
          <span class="kw">spatiale</span>, applications
          <span class="kw">web</span>
        </p>
      </div>
    </div>
  </body>
</html>
